spring:
  main:
    banner-mode: off
    log-startup-info: false
  jackson:
    serialization.INDENT_OUTPUT: true

logging:
  level:
    ru.yandex.practicum.telemetry: info
    org:
      springframework: error
      apache.kafka: warn

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 0

spring:
  sql.init:
    mode: ALWAYS
    schema-locations: classpath:schema.sql
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/order_db
    username: dbuser
    password: 12345
  jpa:
    generate-ddl: false
    hibernate.ddl-auto: validate
    show-sql: true
    properties.hibernate.format_sql: true
  cloud:
    openfeign:
      client:
        config:
          default:  # применяется по умолчанию для всех клиентов
            connectTimeout: 2000
            readTimeout: 3000
            loggerLevel: basic
      circuitbreaker:
        enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        recordFailurePredicate: ru.yandex.practicum.order.fallback.FailurePredicate
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

logging:
  level:
    ru.yandex.practicum.order: DEBUG
    ru.yandex.practicum.order.feign: DEBUG

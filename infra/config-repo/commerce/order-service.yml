server:
  port: 0

spring:
  sql.init:
    mode: ALWAYS
    schema-locations: classpath:schema.sql
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/order_db
    username: dbuser
    password: 12345
  jpa:
    generate-ddl: false
    hibernate.ddl-auto: validate
    show-sql: true
    properties.hibernate.format_sql: true
  cloud:
    openfeign:
      client:
        config:
          default:  # применяется по умолчанию для всех клиентов
            connectTimeout: 2000
            readTimeout: 3000
            loggerLevel: basic

logging:
  level:
    ru.yandex.practicum.order.feign: DEBUG

spring:
  main:
    banner-mode: OFF
  sql:
    init:
      mode: ALWAYS
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/sht-store
    username: dbuser
    password: 12345
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default-schema: public
        show-sql: true
        format-sql: true
  jackson:
    serialization:
      INDENT_OUTPUT: true

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus, info, mappings

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 50
      failureRateThreshold: 50

logging:
  level:
    root: info
